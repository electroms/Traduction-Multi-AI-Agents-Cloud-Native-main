version: "3.9"

# ╔══════════════════════════════════════════════════════════════════╗
# ║  Générateur de podcast IA  —  Edition renforcée en sécurité        ║
# ║  Mécanismes de sécurité adaptés de ryoooo/microvm-openclaw.nix     ║
# ║                                                                    ║
# ║  Correspondance des couches de défense :                           ║
# ║  [microVM NixOS]               [équivalent Docker]                ║
# ║  Isolation noyau KVM           seccomp + cap_drop ALL             ║
# ║  nftables microvm-egress log   nftables/iptables hôte            ║
# ║  journal de requêtes DNS Unbound  conteneur dns-audit (sidecar)  ║
# ║  secrets virtiofs + rotation   secrets-init + /run/secrets        ║
# ║  auditd monitor répertoire secrets  inotifywait dans secrets-init ║
# ║  correction AF_NETLINK Node.js    security/seccomp-openclaw.json  ║
# ╚══════════════════════════════════════════════════════════════════╝

# ── Configuration de sécurité commune (héritée par tous les conteneurs) ────────────
x-security-base: &security-base
  security_opt:
    - no-new-privileges:true  # empêcher l'escalade des privilèges setuid/setgid
  init: true                  # PID 1 = tini (évite les processus zombies)
  restart: unless-stopped

# ── Configuration de sécurité spécifique OpenClaw ───────────────────────────────
x-openclaw-security: &openclaw-security
  security_opt:
    - no-new-privileges:true
    # seccomp : profil personnalisé, autorise AF_NETLINK (requis par Node.js), bloque CLONE_NEWUSER
    # correspond à l'isolation noyau microvm.nix + correction AF_NETLINK de buduroiu
    - seccomp:./security/seccomp-openclaw.json
  cap_drop:
    - ALL             # supprimer toutes les capacités Linux
  cap_add:
    - NET_BIND_SERVICE # Le gateway OpenClaw doit écouter sur le port :18789
    - CHOWN           # set file ownership during init
    - SETUID          # may be needed by Node.js
    - SETGID
  read_only: false    # OpenClaw needs to write to ~/.openclaw/ (ProtectSystem=full equivalent)
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m  # in-memory /tmp, no exec
  init: true

services:

  # ════════════════════════════════════════════════════════
  #  COUCHE 0 : secrets-init
  #  pattern secrets virtiofs + équivalent auditd
  #  Correspond à : systemd.services.openclaw-prepare-secrets
  #                security.audit.rules = ["-w /run/secrets -p rwxa"]
  #
  #  Régénère gateway-token à chaque démarrage (rotation de démarrage)
  #  inotifywait surveille tous les accès à /run/secrets
  # ════════════════════════════════════════════════════════
  secrets-init:
    image: alpine:3.19
    container_name: secrets-init
    networks:
      - internal-net
    volumes:
      - secrets-vol:/run/secrets
      - ./security/secrets-init.sh:/secrets-init.sh:ro
      - ./config:/openclaw-config:rw
    command: ["/bin/sh", "/secrets-init.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    # inotify-tools included in alpine packages
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache inotify-tools xxd jq 2>/dev/null || true &&
        /bin/sh /secrets-init.sh &&
        echo '[secrets-init] Staying alive to maintain auditd monitoring...' &&
        tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "test", "-f", "/run/secrets/gateway-token"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ════════════════════════════════════════════════════════
  #  COUCHE 1 : dns-audit (journalisation des requêtes DNS Unbound)
  #  Équivalent NixOS :
  #    services.unbound.settings.server = {
  #      log-queries = "yes";
  #      interface = [ "192.168.83.1" ];
  #    };
  #
  #  Toutes les requêtes DNS des conteneurs OpenClaw passent par ce conteneur.
  #  docker logs dns-audit affiche les résolutions en temps réel.
  #  Les domaines suspects sont visibles immédiatement.
  # ════════════════════════════════════════════════════════
  dns-audit:
    image: mvance/unbound:latest
    platform: linux/amd64
    container_name: dns-audit
    networks:
      podcast-net:
        ipv4_address: 172.20.0.53   # fixed IP; used by OpenClaw container as DNS
      internal-net: {}
    volumes:
      - ./security/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind :53
      - SETUID
      - SETGID
      - SYS_CHROOT          # required by Unbound
      - CHOWN               # startup chown
      - DAC_OVERRIDE        # device file access
      - MKNOD               # create /dev/{random,urandom,null}
    healthcheck:
      test: ["CMD", "drill", "@127.0.0.1", "cloudflare.com"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ════════════════════════════════════════════════════════
  #  COUCHE 2 : Ollama (backend LLM)
  # ════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - internal-net    # not exposed to podcast-net; internal calls only
    ports:
      - "127.0.0.1:11435:11434"   # use 11435 on host to avoid conflict with local Ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_CTX=16384
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 16g
          cpus: '16'
    <<: *security-base
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ════════════════════════════════════════════════════════
  #  COUCHE 3 : Passerelle OpenClaw (renforcement de sécurité principal)
  #
  #  Mécanismes de sécurité (5 couches, correspondant à microvm-openclaw.nix) :
  #
  #  [1] seccomp-openclaw.json
  #      - suppression de toutes les capacités (cap_drop : ALL)
  #      - autorise le socket AF_NETLINK (requis par Node.js libuv)
  #      - bloque CLONE_NEWUSER pour éviter les sorties d'espace de noms
  #
  #  [2] Token de passerelle lu depuis /run/secrets/gateway-token
  #      (rotation à chaque démarrage de secrets-init, équivalent à virtiofs)
  #
  #  [3] DNS forcé via le conteneur dns-audit (172.20.0.53)
  #      toutes les résolutions sont enregistrées par Unbound (journal DNS)
  #
  #  [4] Isolation réseau : uniquement podcast-net et internal-net
  #      accès impossible au système de fichiers hôte ou autres réseaux Docker
  #
  #  [5] Liste blanche d'outils : exécution désactivée (prévenir l'évasion de shell)
  #      autorisé uniquement : web_search, read, write
  # ════════════════════════════════════════════════════════
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    networks:
      podcast-net:
        ipv4_address: 172.20.0.10
      internal-net: {}
    depends_on:
      secrets-init:
        condition: service_healthy
      dns-audit:
        condition: service_healthy
      ollama:
        condition: service_healthy
    # ── DNS auditing (corresponds to nameservers = [ "192.168.83.1" ]) ──
    dns:
      - 172.20.0.53    # force use of dns-audit container (Unbound + query log)
    dns_search: []
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      # Token is read from the file generated by secrets-init (rotated on each startup)
      - OPENCLAW_GATEWAY_TOKEN_FILE=/run/secrets/gateway-token
    volumes:
      - ./config:/home/node/.openclaw:rw              # openclaw.json config
      - ./workspace:/home/node/.openclaw/workspace:rw # Agent workspace (write access, ProtectSystem=full equivalent)
      - secrets-vol:/run/secrets:ro                   # read-only secrets mount
    ports:
      - "127.0.0.1:18789:18789"   # bind loopback only (corresponds to gateway.bind loopback)
    command:
      - node
      - dist/index.js
      - gateway
      - --allow-unconfigured
      - --bind
      - lan
      - --port
      - "18789"
    # ── Security hardening (5 layers) ────────────────────
    <<: *openclaw-security
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18789/healthz"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ════════════════════════════════════════════════════════
  #  Initialisation du modèle (one-shot; télécharge le modèle LLM)
  # ════════════════════════════════════════════════════════
  model-init:
    image: curlimages/curl:latest
    container_name: model-init
    networks:
      - internal-net
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "==> Checking model..."
        if curl -s http://ollama:11434/api/tags | grep -q "qwen3:1.7b"; then
          echo "==> qwen3:1.7b already exists"
        else
          echo "==> Pulling qwen3:1.7b..."
          curl -s -X POST http://ollama:11434/api/pull \
            -H 'Content-Type: application/json' \
            -d '{"name":"qwen3:1.7b"}' | tail -3
        fi
        echo "==> Done ✓"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  # ════════════════════════════════════════════════════════
  #  Application Podcast (générateur de podcast entièrement automatisé)
  # ════════════════════════════════════════════════════════
  podcast-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: podcast-app
    networks:
      - internal-net
      - podcast-net
    depends_on:
      openclaw:
        condition: service_healthy
    dns:
      - 172.20.0.53    # via dns-audit
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OPENCLAW_GATEWAY=http://openclaw:18789
      - OPENCLAW_TOKEN_FILE=/run/secrets/gateway-token  # read rotated token
      - SERPAPI_KEY=${SERPAPI_KEY}
      - PODCAST_OUTPUT_DIR=/app/output
      - PODCAST_MODEL=qwen3:1.7b
      - TOPICS_PER_RUN=${TOPICS_PER_RUN:-1}
      - SCHEDULE_HOURS=${SCHEDULE_HOURS:-0}
      - SKIP_SEARCH=${SKIP_SEARCH:-0}
    volumes:
      - ./output:/app/output
      - secrets-vol:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: "no"

# ── Network definitions ────────────────────────────────────────────────────────────────
networks:
  # podcast-net : accessible par OpenClaw (avec audit DNS)
  # correspond au bridge microvm 192.168.83.0/24
  podcast-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: br-podcast
      # egress logging done by host nftables rules (security/egress-monitor.sh)

  # internal-net : communication interne uniquement (Ollama <-> App, pas d'audit DNS)
  internal-net:
    driver: bridge
    internal: false   # Ollama doit pouvoir télécharger des modèles
    ipam:
      config:
        - subnet: 172.21.0.0/24

# ── Persistent volumes ────────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    driver: local
  # secrets-vol : mode tmpfs (en mémoire, vidé au redémarrage, équivalent à monture éphémère virtiofs)
  secrets-vol:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=10m,mode=0700,noexec,nosuid"
