# unbound.conf — audit des requêtes DNS
# Toutes les requêtes DNS des conteneurs OpenClaw sont redirigées via ce conteneur.
# Chaque requête est journalisée sur stdout (visible avec docker logs).
# Toute résolution de domaine suspecte par OpenClaw est immédiatement identifiable.

server:
    # Liaison sur toutes les interfaces (réseau bridge Docker)
    interface: 0.0.0.0
    port: 53

    # Autoriser uniquement les sous-réseaux de confiance
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow     # Plage par défaut du bridge Docker
    access-control: 192.168.0.0/16 allow    # Sous-réseau personnalisé

    # ── Paramètres de sécurité principaux ────────────────────
    # Journaliser toutes les requêtes DNS
    verbosity: 2
    log-queries: yes
    log-replies: yes
    log-tag-queryreply: yes

    # Sortie vers stdout (capturée par docker logs)
    use-syslog: no
    logfile: ""

    # Masquer l'identité et la version du serveur DNS
    hide-identity: yes
    hide-version: yes

    # Requêtes récursives désactivées (mode forward only)
    do-not-query-localhost: no

    # TTL minimal (pour détection rapide des modifications DNS)
    cache-min-ttl: 0
    cache-max-ttl: 300

    # Validation DNSSEC
    val-log-level: 2

    # Nombre de threads (léger)
    num-threads: 1
    so-rcvbuf: 1m

    # Protection d'adresses privées
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: fc00::/7

# Transfert DNS en amont (Cloudflare DoT)
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 8.8.8.8@853#dns.google
