apiVersion: v1
kind: Service
metadata:
  name: blog-agent-svc
  labels:
    app: blog-agent
spec:
  type: ClusterIP
  selector:
    app: blog-agent
  ports:
    # Main container (Nginx) - blog viewer & reverse proxy to sidecars
    - name: http
      port: 80
      targetPort: 80
    # Sidecar 1 (Copilot Agent) - accessible uniquement dans le cluster / via port-forward
    - name: agent-api
      port: 8001
      targetPort: 8001
    # Sidecar 2 (Skill Server) - accessible uniquement dans le cluster / via port-forward
    - name: skill-api
      port: 8002
      targetPort: 8002
